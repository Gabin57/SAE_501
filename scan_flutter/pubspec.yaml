name: scan_flutter
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  http: ^1.6.0
  http_parser: ^4.0.2
  camera: ^0.11.3
  path_provider: ^2.1.5
  path: ^1.9.1
  image: ^4.5.4
  permission_handler: ^12.0.1
  flutter_spinkit: ^5.2.2
  shared_preferences: ^2.1.0
  flutter_svg: ^2.2.3
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - ./assets/images/
